# Kustomize config API version.
apiVersion: kustomize.config.k8s.io/v1beta1
# Marks this file as the entry point for `kubectl apply -k k8s`.
kind: Kustomization

# Puts every resource below in the dnsquery namespace, so the individual manifests don't hard-code it.
namespace: dnsquery

# Manifests to include, in apply order.
resources:
  # First, so the namespace exists before anything is created in it.
  - namespace.yaml
  # The pods running the server.
  - deployment.yaml
  # Stable in-cluster address for the pods.
  - service.yaml
  # Protects availability during node drains.
  - pdb.yaml
  # Scales the Deployment on CPU.
  - hpa.yaml

# Point at your registry, e.g.:
#   kustomize edit set image dnsquery=registry.example.com/dnsquery:v1.0.0
# Rewrites the image reference in deployment.yaml without editing it.
images:
  # Matches the `image: dnsquery:...` reference in the Deployment.
  - name: dnsquery
    # Placeholder tag that matches the locally built image loaded into minikube;
    # replace with a versioned tag for real deployments.
    newTag: latest
