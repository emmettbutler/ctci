apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dnsquery

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
  - hpa.yaml

# Point at your registry, e.g.:
#   kustomize edit set image dnsquery=registry.example.com/dnsquery:v1.0.0
images:
  - name: dnsquery
    newTag: latest
